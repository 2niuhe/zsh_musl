name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create or update
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64-musl
            runner: ubuntu-24.04
          - target: linux-arm64-musl
            runner: ubuntu-24.04-arm
          - target: darwin-amd64
            runner: macos-15-intel
          - target: darwin-arm64
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build
        env:
          BUILD_COMMIT: ${{ github.sha }}
        run: |
          if [[ "${{ matrix.target }}" == linux-* ]]; then
            ./scripts/build-linux.sh --target "${{ matrix.target }}"
          else
            set -o pipefail
            ./scripts/build-macos.sh --target "${{ matrix.target }}" 2>&1 | tee build.log
          fi
      - name: Report macOS build failure
        if: ${{ failure() && startsWith(matrix.target, 'darwin-') }}
        run: |
          diagnostics="$(
            {
              grep -Ein 'error|fatal|undefined|failed|not found' build.log || true
              grep -Ein 'error|fatal|undefined|failed|not found' \
                "build/${{ matrix.target }}/zsh-5.9.2/config.log" 2>/dev/null || true
              tail -n 40 build.log || true
            } | tail -n 60 | tr '\n' ' ' | cut -c1-6000
          )"
          echo "::error::$diagnostics"
      - name: Upload macOS build log
        if: ${{ failure() && startsWith(matrix.target, 'darwin-') }}
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.2
        with:
          name: macos-build-log-${{ matrix.target }}
          path: build.log
          if-no-files-found: ignore
      - name: Verify target binary
        run: ./scripts/verify.sh --target "${{ matrix.target }}"
      - name: Package and verify archive
        run: |
          ./scripts/package.sh --target "${{ matrix.target }}"
          archive="dist/zsh-5.9.2-${{ matrix.target }}.tar.gz"
          ./scripts/verify.sh --target "${{ matrix.target }}" --archive "$archive"
      - name: Upload target package
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.2
        with:
          name: package-${{ matrix.target }}
          path: dist/zsh-5.9.2-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download target packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      - name: Generate and verify checksums
        working-directory: dist
        run: |
          sha256sum zsh-*.tar.gz | sort -k2 > SHA256SUMS
          sha256sum --check SHA256SUMS
          test "$(find . -maxdepth 1 -name 'zsh-*.tar.gz' | wc -l)" -eq 4
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        working-directory: dist
        run: |
          set -o pipefail
          {
            gh --version
            if gh release view "$RELEASE_TAG"; then
              gh release upload "$RELEASE_TAG" zsh-*.tar.gz SHA256SUMS --clobber
            else
              gh release create "$RELEASE_TAG" zsh-*.tar.gz SHA256SUMS \
                --title "zsh $RELEASE_TAG" \
                --generate-notes \
                --target "$GITHUB_SHA"
            fi
          } 2>&1 | tee publish.log
      - name: Report publish failure
        if: ${{ failure() }}
        working-directory: dist
        run: |
          echo "::error::$(tail -n 80 publish.log | tr '\n' ' ' | cut -c1-6000)"
