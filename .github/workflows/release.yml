name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create or update
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64-musl
            runner: ubuntu-24.04
          - target: linux-arm64-musl
            runner: ubuntu-24.04-arm
          - target: darwin-amd64
            runner: macos-13
          - target: darwin-arm64
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build
        env:
          BUILD_COMMIT: ${{ github.sha }}
        run: |
          if [[ "${{ matrix.target }}" == linux-* ]]; then
            ./scripts/build-linux.sh --target "${{ matrix.target }}"
          else
            ./scripts/build-macos.sh --target "${{ matrix.target }}"
          fi
      - name: Verify target binary
        run: ./scripts/verify.sh --target "${{ matrix.target }}"
      - name: Package and verify archive
        run: |
          ./scripts/package.sh --target "${{ matrix.target }}"
          archive="dist/zsh-5.9.2-${{ matrix.target }}.tar.gz"
          ./scripts/verify.sh --target "${{ matrix.target }}" --archive "$archive"
      - name: Upload target package
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.2
        with:
          name: package-${{ matrix.target }}
          path: dist/zsh-5.9.2-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download target packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      - name: Generate and verify checksums
        working-directory: dist
        run: |
          sha256sum zsh-*.tar.gz | sort -k2 > SHA256SUMS
          sha256sum --check SHA256SUMS
          test "$(find . -maxdepth 1 -name 'zsh-*.tar.gz' | wc -l)" -eq 4
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        working-directory: dist
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" zsh-*.tar.gz SHA256SUMS --clobber
          else
            gh release create "$RELEASE_TAG" zsh-*.tar.gz SHA256SUMS \
              --title "zsh $RELEASE_TAG" \
              --generate-notes \
              --target "$GITHUB_SHA"
          fi

